name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Pull your code from the repository into the runner
      - name: Check out code
        uses: actions/checkout@v4

      # 2. Install Python on the clean Linux server
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

# 3. Upgrade pip and install your project dependencies (including pytest)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest  # Ensures pytest is available on the runner

      # 4. Run automated tests
      - name: Run tests with pytest
        run: |
          pytest backend/test_main.py