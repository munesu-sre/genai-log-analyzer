global:
  scrape_interval: 5s  # Check all targets every 5 seconds

scrape_configs:
  # 1. FastAPI application metrics
  - job_name: 'fastapi_log_analyzer'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['web:8000']

  # 2. PostgreSQL internal database metrics
  - job_name: 'postgres_database'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # --- 3. NEW: Container CPU & Memory metrics via cAdvisor ---
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']